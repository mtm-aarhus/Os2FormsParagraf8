name: Linting

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint
          pip install -e .

      - name: Flake8
        run: flake8 --max-line-length 200 robot_framework src scripts

      - name: Pylint
        run: pylint --max-line-length 200 robot_framework src scripts

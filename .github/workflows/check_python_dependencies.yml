# .github/workflows/check_python_dependencies.yml
name: Tjek Python pakke kompatibilitet

on:
  push:
    paths:
      - 'requirements.txt'
  pull_request:
    paths:
      - 'requirements.txt'
  # Tillad manuel kørsel
  workflow_dispatch:

jobs:
  check-dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install ODBC Driver 18
        run: |
          echo "Installing ODBC Driver 18..."
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          echo "ODBC Driver 18 installed."

      - name: Verify dependencies
        run: |
          echo "📦 Installerer pakker fra requirements.txt"
          pip install --no-cache-dir -r requirements.txt

          echo "🔍 Tjekker pakke kompatibilitet"
          pip check

          echo "✅ Alle pakker er kompatible med Python 3.12"
